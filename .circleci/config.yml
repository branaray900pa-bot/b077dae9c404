version: 2.1

jobs:
  flint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Minimal VCF
          command: |
            printf '##fileformat=VCFv4.2\n#CHROM\tPOS\tID\tREF\tALT\tQUAL\tFILTER\tINFO\n1\t10177\t.\tA\tAC\t50\tPASS\t.\n' > calls.vcf
      - run:
          name: make
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flint -j2
      - run:
          name: Filter QUAL<30 and depth
          command: ./build/flint calls.vcf --min-qual 30 --min-dp 8
  ahuTuning:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Damper setpoints
          command: |
            printf 'oa_min=%s\nsa_temp=%s\n' 0.15 13.5 > ahu.cfg
      - run:
          name: Build via PlatformIO
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ahuTuning -j2
      - run:
          name: Economizer mode schedule
          command: ./build/ahuTuning ahu.cfg --days 5
  sedge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Shoot folder
          command: |
            mkdir -p shoot && seq -w 1 60|xargs -I{} touch -d '2026-10-20 10:00' shoot/DSC{}.jpg
      - run:
          name: swift build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target sedge -j2
      - run:
          name: Cull by sharpness and duplicates
          command: ./build/sedge shoot/ --keep 25%
  crewpair-eu:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Flight legs
          command: |
            set -- 'LIS-MAD 0700 0820' 'MAD-LIS 0900 1020' 'LIS-OPO 1100 1155'; printf '%s\n' "$@" > legs.txt
      - run:
          name: mvn package
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target crewpair-eu -j2
      - run:
          name: Crew pairing, FTL rules
          command: ./build/crewpair-eu legs.txt --max-duty 13h
  tex-thesis:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Main document
          command: |
            mkdir -p chapters && printf '%s\n' '\documentclass{report}' '\begin{document}' '\end{document}' > main.tex
      - run:
          name: latexmk -pdf
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target tex-thesis -j2
      - run:
          name: Typeset and check overfull boxes
          command: ./build/tex-thesis main.tex --max-overfull 0
  roofsolar:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Roof polygons
          command: |
            echo 'roof1 120 S 25' > roofs.txt; echo 'roof2 80 E 30' >> roofs.txt
      - run:
          name: Skip build (vendored)
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target roofsolar -j2
      - run:
          name: Annual yield estimate
          command: ./build/roofsolar roofs.txt --lat 23.6 --kwp-per-m2 0.2
  etl-weekly-crm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Mock exported contacts
          command: |
            for _ in $(seq 400); do echo 'acme,ana,ana@acme.test'; done > contacts.csv
      - run:
          name: pip wheel .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target etl-weekly-crm -j2
      - run:
          name: Dedupe and upsert contacts
          command: ./build/etl-weekly-crm contacts.csv --key email --batch 50
  foldtiny:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Sequence FASTA
          command: |
            LC_ALL=C echo '>p1' > seq.fa && echo MKTAYIAKQRQISFVKSHFSRQ >> seq.fa
      - run:
          name: pip install . (torch cpu)
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target foldtiny -j2
      - run:
          name: Predict structure, 3 recycles
          command: ./build/foldtiny seq.fa --recycles 3 --device cpu
  hdrmerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Bracket set
          command: |
            for ev in -2 0 2; do head -c 50000 /dev/urandom > ev$ev.tif; done
      - run:
          name: make
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hdrmerge -j2
      - run:
          name: Merge and tone map (Reinhard)
          command: ./build/hdrmerge ev-2.tif ev0.tif ev2.tif --tm reinhard
  Obsidian7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Pack phoneme table
          command: |
            printf 'a\ni\nu\ne\no\n'|gzip > phonemes.gz
      - run:
          name: make -j3
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Obsidian7 -j2
      - run:
          name: Forced alignment pass
          command: ./build/Obsidian7 -r 16000 --beam 12
  ReturnsReason:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Return notes
          command: |
            set -- 'too small' 'arrived broken' 'changed mind' 'too small'; printf '%s\n' "$@"|sort|uniq -c > returns.txt
      - run:
          name: no compile needed
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ReturnsReason -j2
      - run:
          name: Cluster reasons
          command: ./build/ReturnsReason returns.txt --k 5
  claims-triage:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Claim notes
          command: |
            seq 200 | sed 's#.*#rear-ended at junction, minor damage#' > notes.txt
      - run:
          name: dotnet build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target claims-triage -j2
      - run:
          name: Triage by severity
          command: ./build/claims-triage notes.txt --model v3 --fast-track 0.7
  rx_interact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Medication list
          command: |
            echo warfarin ibuprofen metformin|xargs -n1 > meds.txt
      - run:
          name: Skip build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target rx_interact -j2
      - run:
          name: Check pairwise interactions
          command: ./build/rx_interact meds.txt --severity moderate+
  xcompile-riscv:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Toolchain file
          command: |
            LC_ALL=C echo 'set(CMAKE_SYSTEM_PROCESSOR riscv64)' > rv.cmake && ln -sf rv.cmake toolchain.cmake
      - run:
          name: cmake -DCMAKE_TOOLCHAIN_FILE=toolchain.cmake --build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target xcompile-riscv -j2
      - run:
          name: Cross-compile and run under qemu
          command: ./build/xcompile-riscv --qemu riscv64
  keelcad:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Hull section offsets
          command: |
            printf '%s,%s\n' 0 0.0 1 0.8 2 1.3 3 1.5 > offsets.csv
      - run:
          name: dotnet build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target keelcad -j2
      - run:
          name: Loft hull surface
          command: ./build/keelcad --stations 12 --export step
  lorawanAdr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Device RSSI history
          command: |
            seq 60 120|sed 's/^/-/'|shuf -n 300 -r > rssi.txt
      - run:
          name: cargo build --target thumbv7em-none-eabihf
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lorawanAdr -j2
      - run:
          name: ADR data-rate decisions
          command: ./build/lorawanAdr rssi.txt --margin 10
  TollGantry:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Plate reads
          command: |
            for _ in $(seq 1000); do echo 'ABC-1234 2026-10-28T08:00:00'; done > plates.txt
      - run:
          name: cmake --build build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target TollGantry -j2
      - run:
          name: Match reads to trips
          command: ./build/TollGantry plates.txt --window 20m
  yarrow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Cloth grid dims
          command: |
            ( echo 64x64 > grid.txt )
      - run:
          name: nvcc -arch=sm_86
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target yarrow -j2
      - run:
          name: Position-based dynamics, 600 steps
          command: ./build/yarrow grid.txt --steps 600 --stiffness 0.9
  openapi_diff:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Two spec versions
          command: |
            command echo 'openapi: 3.1.0' > a.yaml && cp a.yaml b.yaml && echo 'x-rev: 2' >> b.yaml && diff a.yaml b.yaml > spec.diff || true
      - run:
          name: No build step
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target openapi_diff -j2
      - run:
          name: Breaking-change report
          command: ./build/openapi_diff a.yaml b.yaml --fail-on breaking
  marrow:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install essentials
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Rubric
          command: |
            { echo 'thesis 20'; echo 'evidence 40'; echo 'style 20'; echo 'mechanics 20'; } > rubric.txt
      - run:
          name: Skip build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target marrow -j2
      - run:
          name: Score 60 essays against rubric
          command: ./build/marrow rubric.txt --essays 60
  cobalt:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Session table
          command: |
            seq 1 10000|sed 's/^/sess_/' > sessions.txt
      - run:
          name: cargo build --release
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cobalt -j2
      - run:
          name: Expire idle sessions
          command: ./build/cobalt sessions.txt --idle 30m
  cidr-aggregate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Route table
          command: |
            seq 0 255|sed 's/^/10.0./;s/$/.0\/24/' > routes.txt
      - run:
          name: Compile with cc -O2
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cidr-aggregate -j2
      - run:
          name: Aggregate to minimal prefixes
          command: ./build/cidr-aggregate routes.txt
  gdprexport:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Subject identifier
          command: |
            echo user_48213 > subject.txt
      - run:
          name: dotnet build -c Release
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gdprexport -j2
      - run:
          name: Assemble subject access bundle
          command: ./build/gdprexport subject.txt --format json --redact-third-party
  ballast-calc:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Tank table
          command: |
            printf '%s %s\n' WB1 820 WB2 820 FP 300 AP 280 > tanks.txt
      - run:
          name: dotnet build -p:TreatWarningsAsErrors=true
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ballast-calc -j2
      - run:
          name: Trim and stability check
          command: ./build/ballast-calc tanks.txt --draft 8.2
  thistle:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Metric lines
          command: |
            awk -v s='cpu.load,host=a,value=0.43' 'BEGIN{for(i=0;i<100000;i++)print s}' > metrics.txt
      - run:
          name: make
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target thistle -j2
      - run:
          name: Ingest 100k points, gorilla-compress
          command: ./build/thistle metrics.txt --shard 4
  parquet-rewrite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Column list
          command: |
            touch cols.txt && echo id,ts,value,tag >> cols.txt
      - run:
          name: cargo build --release
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target parquet-rewrite -j2
      - run:
          name: Rewrite row groups to 128 MB
          command: ./build/parquet-rewrite --rg-size 128mb
  Bramblewick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write save-game header
          command: |
            head -c 16 /dev/zero > save.bin && printf 'BWK\001'|dd of=save.bin conv=notrunc 2>/dev/null
      - run:
          name: Cook quest assets
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Bramblewick -j2
      - run:
          name: Load save then run quest 3
          command: ./build/Bramblewick --save save.bin --quest 3 --speed 4x
  hlsPackager:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Source MP4 stub
          command: |
            truncate -s 5M input.mp4
      - run:
          name: Skip build (ffmpeg)
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hlsPackager -j2
      - run:
          name: Package 3 renditions, 6 s segments
          command: ./build/hlsPackager input.mp4 --ladder 360,720,1080 --seg 6
  wren:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Transaction sample
          command: |
            awk 'BEGIN{for(i=0;i<3000;i++)printf "%d,%.2f,%d\n",i,rand()*900,int(rand()*24)}' > txns.csv
      - run:
          name: lightgbm cmake build
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wren -j2
      - run:
          name: Score and threshold
          command: ./build/wren txns.csv --model v7 --cutoff 0.83
  skureorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Stock snapshot
          command: |
            ( printf 'sku,on_hand,lead_days\n' > stock.csv && seq 1 60|awk '{print "SKU"$1","int(rand()*50)","$1%9+2}' >> stock.csv )
      - run:
          name: pip wheel --no-deps .
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target skureorder -j2
      - run:
          name: Compute reorder points
          command: ./build/skureorder stock.csv --service-level 0.95

workflows:
  main:
    jobs:
      - flint
      - ahuTuning
      - sedge
      - crewpair-eu
      - tex-thesis
      - roofsolar
      - etl-weekly-crm
      - foldtiny
      - hdrmerge
      - Obsidian7
      - ReturnsReason
      - claims-triage
      - rx_interact
      - xcompile-riscv
      - keelcad
      - lorawanAdr
      - TollGantry
      - yarrow
      - openapi_diff
      - marrow
      - cobalt
      - cidr-aggregate
      - gdprexport
      - ballast-calc
      - thistle
      - parquet-rewrite
      - Bramblewick
      - hlsPackager
      - wren
      - skureorder
